# 微店24主机；固定文字填 value，动态字段填 key/type。
# 坐标以 203 DPI 为基准；字号、描边和行距以 pt（1/72 英寸）为单位。
# 底图开关、打印机参数在上级 printer 配置中维护。
paper_width: 50
paper_height: 30
design_dpi: 203
font_path: assets/fonts/方正兰亭圆简体.TTF
threshold: 160
font_size_pt: 5.75
bold_width_pt: 0
line_spacing_pt: 9
text_origin_y: 80
fields:
  - type: text
    value: 微店24主机
    x: 27
    line: 0
    text_threshold: 160
  - type: text
    value: 型号：V4
    x: 27
    line: 1
    text_threshold: 160
  - type: date
    label: '生产日期：'
    format: '%Y/%m/%d'
    x: 27
    line: 2
    text_threshold: 160
  - type: text
    value: 北京口袋时尚科技有限公司
    x: 27
    line: 3
    text_threshold: 160
  - type: text
    key: sn
    label: ''
    x: 27
    line: 4
    # 普通行间留白为 9 - 5.75 = 3.25pt；额外增加 3.25pt，形成双倍留白。
    offset_y_pt: 3.25
    text_threshold: 160
  - type: qrcode
    key: sn
    x: 250
    y: 94
    size: 110
    error_correction: M
  - type: disk_size
    x: 306
    y: 208
    align: center
