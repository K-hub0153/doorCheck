schema_version: 1
sample_interval_s: 10
max_sample_gap_s: 40
min_free_space_mib: 256
max_log_mib: 64
environment:
  chamber_id: '2'
  set_temperature_c: 45.0
  set_humidity_pct: 45.0
  measured_source: none
  measured_temperature: null
  measured_humidity: null
items:
  cpu:
    enabled: true
    duration_min: 1
    target_busy_pct: 95
    grace_s: 60
  ddr:
    enabled: true
    duration_min: 1
    max_memory_pct: 10
    reserve_mib: 256
  storage:
    enabled: true
    duration_min: 1
    targets:
    - /data
    write_budget_gib: 8.0
    chunk_mib: 250
    rounds: 2
    log_reserve_mib: 64
    metadata_reserve_mib: 64
    cumulative_write_budget_gib: null
    direct: true
  lte:
    enabled: true
    duration_min: 1
    at_port: ''
  battery:
    enabled: true
    duration_min: 1
    charge_duration_min: 1
    discharge_duration_min: 0
    cycles: 1
    completion_mode: fixed_duration
    configure_shutdown: false
    current_direction_confirmed: false
    stop_current_ma: 50
    stop_confirm_samples: 6
    max_read_failures: 3
  usb:
    enabled: true
    duration_min: 1
    min_speed_mbps: 5000
    fixture_confirmed: false
  hdmi:
    enabled: true
    duration_min: 1
    display_confirmed: false
protection:
  cpu_stop_temperature_c: null
  battery_charge_temperature_range_c: null
  battery_discharge_temperature_range_c: null
  battery_min_voltage_mv: null
  battery_max_voltage_mv: null
  battery_max_abs_current_ma: null
  discharge_min_soc_pct: null
