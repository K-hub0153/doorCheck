# 微店24门锁控制器；固定文字填 value，动态字段填 key/type。
# 坐标以 203 DPI 为基准；字号、描边和行距以 pt（1/72 英寸）为单位。
# 底图开关、打印机参数在上级 printer 配置中维护。
paper_width: 50
paper_height: 30
design_dpi: 203
font_path: assets/fonts/方正兰亭圆简体.TTF
threshold: 160
font_size_pt: 5.75
bold_width_pt: 0.15
line_spacing_pt: 9
text_origin_y: 80
fields:
  - type: text
    value: 微店24门锁控制器
    x: 27
    line: 0
    text_threshold: 205
  - type: text
    value: 型号：ACU-01-V1
    x: 27
    line: 1
    text_threshold: 205
  - type: text
    value: 生产日期：
    x: 27
    line: 2
    text_threshold: 205
  - type: date
    format: '%Y/%m/%d'
    x: 120
    line: 2
    text_threshold: 205
  - type: text
    value: 北京口袋时尚科技有限公司
    x: 27
    line: 3
    text_threshold: 205
  # 空行，不产生任何墨点。
  - type: text
    value: ''
    x: 27
    line: 4
  - type: text
    key: sn
    label: 'SN：'
    x: 27
    line: 5
    text_threshold: 205
  - type: qrcode
    key: sn
    x: 253.75
    y: 74.43
    size: 106.3
    error_correction: M
