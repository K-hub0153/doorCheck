battery:
  i2c_addr: 0x0b
  i2c_bus: 0
  # 休眠（shutdown）配置的地址字按电池品牌区分：
  #   博立威 Greenway: Auto Ship 0xD0 0x4B / 关机时间 0x04 0x4C
  #   九夷 Sunwoda  : Auto Ship 0x8B 0x48 / 关机时间 0xAF 0x48
  # 留空 shutdown_profiles 即用内置品牌表（src/master_control/core/battery_profile.py）；
  # 新增品牌时展开本节点，整表以配置为准（不再合并内置表）。
  shutdown_profiles: []
  # 已知批次可直接指定品牌，跳过按厂商名识别（值写 name 字段，如 九夷 Sunwoda）
  # force_profile: 九夷 Sunwoda
chips:
  hisi:
    battery_detection: true
    battery_i2c_bus: 2
    battery_shutdown_config: false
    bt_detection: true
    chip_model: 310P
    description: 海思310P芯片 (hisi-xxxxx)
    fan_detection: true
    has_hdmi: false
    nearlink_detection: true
    poe_count: 14
    usb_connector: Type-C
    usb_detection: true
    wifi_detection: true
  wdse:
    battery_detection: true
    bt_detection: true
    chip_model: RK3576
    description: 瑞芯微RK3576芯片 (wdse-xxxxx)
    fan_detection: true
    has_hdmi: true
    nearlink_detection: true
    poe_count: 8
    usb_connector: Type-A
    usb_detection: true
    wifi_detection: true
database:
  path: ./mc_checker.db
network:
  mdns_service_type: _master._tcp.local.
  poe_interface: eth1
  poe_subnet: 198.19.0.0/24
  scan_subnet: 192.168.1.0/24
printer:
  dpi: 600
  enabled: true
  paper_height: 30
  paper_height_mm: 30
  paper_width: 50
  paper_width_mm: 50
  # 标签内容整体缩放：1.0=原始大小，0.8=80%，1.2=120%（纸张尺寸不变）。
  print_scale: 0.98
  # 整体打印位置校准（毫米）：正数向右/向下，负数向左/向上。
  offset_x_mm: 0.1
  offset_y_mm: 0.2
  printer_ip: null
  printer_name: ZDesigner 110Xi4 600 dpi (1)
  printer_port: null
  protocol: zpl
  require_all_passed: true
  confirm_poe_unplugged: true
  cleanup_after_print: true
  # 底图只在 true 时打印；默认在预印标签上仅打印内容。
  print_background: true
  background_image: config/标签打印底图.png
  # 路径相对工程根目录，打包后相对程序所在目录。
  label_templates:
    hisi: config/label_master_hisi.yaml
    wdse: config/label_master_wdse.yaml
  tspl_layout:
    border:
      thickness: 2
      x1: 2
      x2: 398
      y1: 2
      y2: 238
    date:
      font: '1'
      rotation: 0
      x: 120
      x_scale: 1
      y: 124
      y_scale: 1
    disk_size:
      align: center
      font: '1'
      rotation: 0
      width: 145
      x: 280
      x_scale: 1
      y: 220
      y_scale: 1
    qrcode:
      cell_width: 5
      x: 245
      y: 69
    sn:
      font: '1'
      max_width: 206
      rotation: 0
      x: 34
      x_scale: 1
      y: 205
      y_scale: 1
  zpl_layout:
    date:
      bold_width: 1
      font_size: 50
      x: 370
      y: 412
    disk_size:
      bold_width: 2
      font_size: 65
      x: 897
      y: 620
    font_path: assets/fonts/方正兰亭圆简体.TTF
    qrcode:
      error_correction: M
      size_mm: 14
      x: 830
      y: 270
    render_mode: bitmap
    sn:
      bold_width: 1
      font_size: 50
      x: 150
      y: 580
ssh:
  password: 8Tz299^#6Jxw
  timeout: 10
  username: root
test:
  lte_signal_quality_threshold: 80
  timeout: 10
  wifi_signal_threshold: -40
# USB 3.0 接口检测：设备以 3.x 超速模式枚举即通过（速率 >= min_speed_mbps）
usb:
  min_speed_mbps: 5000
  probe_interval: 1.0
  probe_retries: 2
# 4G 模组：识别厂商 + 按厂商读取信号（判定标准统一，见 src/master_control/core/lte_signal.py）
# 留空 lte 节点即使用内置模组表（移远 AT+QENG / 龙尚 AT+CPSI）
lte: {}
upload:
  retry_delay: 2.0
  retry_times: 2
